[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse-pipeline"
version = "1.0.0"
description = "Open-source source connectors and idempotent ingestion for SYNAPSE"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1,<4",
  "psycopg[binary]>=3.2,<4",
]

[project.scripts]
synapse-pipeline = "synapse_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
