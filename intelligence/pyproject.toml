[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse-intelligence"
version = "1.0.0"
description = "Open-source forecasting and route optimization workers for SYNAPSE Wave 3"
requires-python = ">=3.11"
dependencies = [
  "ortools>=9.10,<10",
  "psycopg[binary]>=3.2,<4",
  "statsforecast>=2,<3",
]

[project.scripts]
synapse-intelligence = "synapse_intelligence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
