name: synapse

x-runtime: &runtime
  restart: unless-stopped
  env_file: ${SYNAPSE_ENV_FILE:-.env}
  init: true
  security_opt:
    - no-new-privileges:true

services:
  api:
    <<: *runtime
    profiles: [development, compatibility, observability]
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    image: synapse-api:1.0.0
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop: [ALL]
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    networks: [backend, monitoring]

  worker:
    <<: *runtime
    profiles: [intelligence]
    build:
      context: .
      dockerfile: deploy/docker/worker.Dockerfile
    image: synapse-worker:1.0.0
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    cap_drop: [ALL]
    environment:
      WORKER_ID: ${WORKER_ID:-worker-01}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-30}
      VALHALLA_URL: ${VALHALLA_URL:-http://valhalla:8002}
      VALHALLA_AUTH_TOKEN: ${VALHALLA_AUTH_TOKEN:-}
      VALHALLA_TILESET_VERSION: ${VALHALLA_TILESET_VERSION:-unconfigured}
      VALHALLA_OSM_CHANGESET: ${VALHALLA_OSM_CHANGESET:-unconfigured}
      ALLOW_HAVERSINE_FALLBACK: ${ALLOW_HAVERSINE_FALLBACK:-false}
    networks: [backend]

  pipeline:
    build:
      context: .
      dockerfile: deploy/docker/pipeline.Dockerfile
    image: synapse-pipeline:1.0.0
    env_file: ${SYNAPSE_ENV_FILE:-.env}
    profiles: [tools]
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    volumes:
      - "${IMPORT_DIRECTORY:-./imports}:/imports:ro"
    networks: [backend]

  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    profiles: [observability]
    restart: unless-stopped
    env_file: ${SYNAPSE_ENV_FILE:-.env}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        sed "s|METRICS_TOKEN_PLACEHOLDER|$${METRICS_TOKEN}|g"
        /etc/prometheus/prometheus.template.yml > /tmp/prometheus.yml;
        exec /bin/prometheus --config.file=/tmp/prometheus.yml
        --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=15d
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.template.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      api:
        condition: service_healthy
    networks: [monitoring]

  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest@sha256:060da5b92e6024a67f65135c236d918b021d63e73d1808a0d55b7e7cbd17240c
    profiles: [routing]
    restart: unless-stopped
    environment:
      tile_urls: ${VALHALLA_TILE_URLS:-}
      use_tiles_ignore_pbf: "True"
    labels:
      mea.synapse.osm-tileset-version: ${VALHALLA_TILESET_VERSION:-unconfigured}
    volumes:
      - valhalla-data:/custom_files
    ports:
      - "${VALHALLA_BIND_ADDRESS:-127.0.0.1}:${VALHALLA_PORT:-8002}:8002"
    networks: [backend]

  # OSRM-compatible road-preview engine for the dashboard `/v1/transport/optimize`
  # Table + Route services. It serves the multi-level Dijkstra (MLD) graph that
  # `scripts/prepare_osrm_graph.sh` builds from a pinned OSM extract into the
  # `osrm-data` volume. This is the controlled self-hosted replacement for the
  # development-only public community OSRM host; production must additionally
  # front it with a controlled HTTPS origin and bind the graph digest into
  # `ROUTING_ENGINE_DATA_VERSION`. The image is pinned to its immutable
  # multi-architecture index digest; update the tag and digest together.
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0@sha256:729461bcc9ae9e6aafa92c0f93db9b060a32e85d5e72092c01ae4a4a9f1eb564
    profiles: [routing]
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    labels:
      mea.synapse.osm-graph-version: ${ROUTING_ENGINE_DATA_VERSION:-unconfigured}
    command:
      - osrm-routed
      - --algorithm
      - mld
      - --ip
      - 0.0.0.0
      - --port
      - "5000"
      - --max-table-size
      - "8000"
      - /data/${OSRM_GRAPH_NAME:-thailand}.osrm
    volumes:
      - osrm-data:/data:ro
    ports:
      - "${OSRM_BIND_ADDRESS:-127.0.0.1}:${OSRM_PORT:-5000}:5000"
    networks: [backend]

networks:
  backend:
  monitoring:

volumes:
  prometheus-data:
  valhalla-data:
  # Prepared by scripts/prepare_osrm_graph.sh before the routing service starts.
  osrm-data:
    name: ${OSRM_VOLUME:-synapse_osrm-data}
    external: true
