global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: synapse-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials: METRICS_TOKEN_PLACEHOLDER
    static_configs:
      - targets: ["api:8000"]
