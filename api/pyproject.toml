[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse-api"
version = "1.0.0"
description = "Role-aware FastAPI service for SYNAPSE Waves 1-3 and operations"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "psycopg[binary]>=3.2,<4",
  "PyJWT[crypto]>=2.9,<3",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
